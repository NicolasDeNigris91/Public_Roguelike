name: Feature request
description: Suggest a gameplay feature, sprint addition, or quality-of-life change.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What current limitation or rough edge motivates this?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: |
        Concrete: what does the player do, what changes in combat, procgen,
        items, or AI?
    validations:
      required: true

  - type: textarea
    id: scope-fit
    attributes:
      label: Scope fit
      description: |
        This is a turn-based grid roguelike portfolio piece. Features that
        match the current sprint scope (combat / items / enemies / FOV) are
        easier to ship than ones that need a new system (multiplayer,
        crafting, story).

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
